apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-lab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jshims/platform_engineering_lab.git
    targetRevision: dev
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
