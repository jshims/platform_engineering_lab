apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-lab.fullname" . }}-nginx
  labels:
    {{- include "platform-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    {{- include "platform-lab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
