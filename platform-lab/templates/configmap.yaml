apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-lab.fullname" . }}-config
  labels:
    {{- include "platform-lab.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  REDIS_HOST: {{ include "platform-lab.fullname" . }}-redis
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
