apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-lab.fullname" . }}-redis
  labels:
    {{- include "platform-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type }}
  selector:
    {{- include "platform-lab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
